<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SST Library</title>
  <style>
    :root {
      --primary: #6c72f8;
      --background: #f7f9fd;
      --card: #ffffff;
      --foreground: #182030;
      --muted: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0f131a;
        --card: #181d26;
        --foreground: #f1f5f9;
        --muted: #94a3b8;
      }
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background);
      color: var(--foreground);
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px -5px rgba(108, 114, 248, 0.15);
      max-width: 360px;
      width: 100%;
      border: 1px solid rgba(108, 114, 248, 0.15);
    }
    .avatar-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6c72f8, #2dd4bf);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 4px 12px rgba(108, 114, 248, 0.25);
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 8px;
    }
    p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 20px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(108, 114, 248, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar-icon">📚</div>
    <h1>SST Chapter Library</h1>
    <p>NCERT Social Science Classes 6–10<br>Connecting to your library...</p>
    <div class="spinner"></div>
  </div>
  <script>
    // If online and configured, forward to current host
    if (window.location.protocol === 'file:' || window.location.hostname === 'localhost') {
      setTimeout(function() {
        if (navigator.onLine) {
          // Stay or retry
        }
      }, 3000);
    }
  </script>
</body>
</html>
